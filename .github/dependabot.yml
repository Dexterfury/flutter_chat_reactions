version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directories: [/, /example]
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      pub:
        patterns: ["*"]
