# Records iOS-simulator GIFs of the example gallery (tool/record_gifs.sh) and
# pushes them on a branch. A PR is opened when the RELEASE_PLEASE_TOKEN secret
# exists (GitHub Actions may not create PRs in this repo otherwise).
#
# Triggers: manual dispatch, a published release, or a push to a non-main
# branch whose head commit message contains [record-gifs]. On a push, lines
# `record-demos: <slugs>` and `record-themes: <themes>` in the head commit
# message narrow the run (e.g. `record-demos: quickstart`).
name: Record demo GIFs

on:
  workflow_dispatch:
    inputs:
      demos:
        description: Space-separated demo slugs (empty = all)
        required: false
        default: ''
      themes:
        description: Space-separated themes
        required: false
        default: 'light dark'
  release:
    types: [published]
  push:
    branches-ignore: [main]
    tags-ignore: ['**']

permissions:
  contents: write

jobs:
  record:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[record-gifs]')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ffmpeg and gifsicle
        run: brew install ffmpeg gifsicle

      - name: Choose demos and themes
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DEMOS: ${{ inputs.demos }}
          INPUT_THEMES: ${{ inputs.themes }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        # Only letters and spaces are kept, so nothing else can reach
        # $GITHUB_ENV; tool/record_gifs.sh validates the values.
        run: |
          demos="$INPUT_DEMOS"
          themes="$INPUT_THEMES"
          if [ "$EVENT" = push ]; then
            demos="$(printf '%s\n' "$HEAD_MESSAGE" |
              sed -n 's/^record-demos:[[:space:]]*//p' | head -n 1)"
            themes="$(printf '%s\n' "$HEAD_MESSAGE" |
              sed -n 's/^record-themes:[[:space:]]*//p' | head -n 1)"
          fi
          demos="$(printf '%s' "$demos" | tr -cd 'a-z ')"
          themes="$(printf '%s' "$themes" | tr -cd 'a-z ')"
          case "$themes" in *[a-z]*) ;; *) themes='' ;; esac
          echo "RECORD_DEMOS=$demos" >>"$GITHUB_ENV"
          echo "RECORD_THEMES=${themes:-light dark}" >>"$GITHUB_ENV"
          echo "Demos: ${demos:-all}; themes: ${themes:-light dark}"

      - name: Record GIFs
        env:
          RECORD_LOG_DIR: ${{ runner.temp }}/gif-logs
        # $RECORD_DEMOS is intentionally unquoted: it is a space-separated list.
        run: THEMES="$RECORD_THEMES" tool/record_gifs.sh $RECORD_DEMOS

      - name: Upload GIFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-gifs
          path: doc/gifs/*.gif
          if-no-files-found: ignore

      - name: Upload recording logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif-logs
          path: |
            ${{ runner.temp }}/gif-logs/*.log
            ${{ runner.temp }}/gif-logs/*.png
            ${{ runner.temp }}/gif-logs/*.mp4
          if-no-files-found: ignore

      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BASE: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="demo-gifs/$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add doc/gifs/*.gif
          if git diff --cached --quiet; then
            echo "No GIF changes."
            exit 0
          fi
          git commit -m "docs: Update demo GIFs"
          git push origin "$branch"
          if [ -n "$GH_TOKEN" ]; then
            gh pr create --base "$BASE" --head "$branch" \
              --title "docs: Update demo GIFs" \
              --body "Recorded on the iOS simulator by workflow run $RUN_ID."
          else
            echo "::notice::Pushed $branch — open a PR into $BASE (no RELEASE_PLEASE_TOKEN secret)."
          fi
