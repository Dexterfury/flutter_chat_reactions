name: flutter_chat_reactions
description: "Add reactions and a context menu to chat messages in Flutter, with adaptive iOS and Material styling."
version: 0.2.7
homepage: https://github.com/Dexterfury/flutter_chat_reactions
repository: https://github.com/Dexterfury/flutter_chat_reactions
issue_tracker: https://github.com/Dexterfury/flutter_chat_reactions/issues
topics:
  - chat
  - reactions
  - emoji
  - context-menu
  - messaging

screenshots:
  - description: 'Messenger-style focused overlay: blurred backdrop, reaction bar above the message and actions below.'
    path: doc/gifs/messenger_light.gif

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
